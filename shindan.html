let resultKey = null;

function updateProgress(step) {
  document.getElementById('progressFill').style.width = (step / TOTAL_STEPS * 100) + '%';
  document.getElementById('progressLabel').textContent = step + ' / ' + TOTAL_STEPS;
}

function mount(html) {
  const el = document.getElementById('cardMount');
  el.innerHTML = html;
}

function renderGenderStep() {
  updateProgress(1);
  mount(`
    <div class="card">
      <img class="card-photo" src="/images/counseling.jpg" alt="5toolgymのカウンセリング風景" loading="eager">
      <div class="card-body">
        <div class="q-num">Body Check</div>
        <div class="q-text">あなたについて教えてください</div>
        <div class="q-sub">30秒で、あなたの体のクセがわかります</div>
        <div class="options">
          <button class="option-btn" onclick="selectGender('female')">
            <span class="opt-text">女性</span>
          </button>
          <button class="option-btn" onclick="selectGender('male')">
            <span class="opt-text">男性</span>
          </button>
        </div>
      </div>
    </div>
  `);
}

function selectGender(g) {
  gender = g;
  gtag('event', 'shindan_gender_select', { gender: g });
  currentStep = 1;
  renderQuestion();
}

function getQuestions() {
  return gender === 'female' ? FEMALE_QUESTIONS : MALE_QUESTIONS;
}

function renderQuestion() {
  updateProgress(currentStep + 1);
  const q = getQuestions()[currentStep - 1];
  multiSelected = [];

  const optionsHtml = q.options.map((opt, i) => {
    if (q.multi) {
      return `
        <button class="option-btn multi" data-idx="${i}" onclick="toggleMultiOption(${i}, ${!!opt.exclusive})">
          <span class="opt-check"></span>
          <span class="opt-text">${opt.text}</span>
        </button>
      `;
    }
    return `
      <button class="option-btn" onclick="selectSingleOption(${i})">
        <span class="opt-text">${opt.text}</span>
      </button>
    `;
  }).join('');

  const nextBtnHtml = q.multi ? `
    <div class="multi-next-wrap">
      <button class="btn-next" id="multiNextBtn" onclick="confirmMultiOption()">次の質問へ</button>
    </div>
  ` : '';

  mount(`
    <div class="card">
      <img class="card-photo" src="${q.photo}" alt="5toolgym薬院店 トレーニング風景" loading="lazy">
      <div class="card-body">
        <div class="q-num">Q${currentStep}</div>
        <div class="q-text">${q.text}</div>
        ${q.sub ? `<div class="q-sub">${q.sub}</div>` : ''}
        <div class="options">${optionsHtml}</div>
        ${nextBtnHtml}
      </div>
    </div>
  `);
}

function advanceStep() {
  if (currentStep === 1) {
    const idx = window.__lastSelectedIdx;
    resultKey = (gender === 'female' ? 'f' : 'm') + (idx + 1);
  }
  currentStep++;
  if (currentStep > getQuestions().length) {
    showResult();
  } else {
    renderQuestion();
  }
}

function selectSingleOption(idx) {
  window.__lastSelectedIdx = idx;
  advanceStep();
}

function toggleMultiOption(idx, exclusive) {
  const btn = document.querySelector(`.option-btn[data-idx="${idx}"]`);
  const allBtns = document.querySelectorAll('.option-btn.multi');

  if (exclusive) {
    allBtns.forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    multiSelected = [idx];
  } else {
    const exclusiveBtn = getQuestions()[currentStep - 1].options.findIndex(o => o.exclusive);
    if (exclusiveBtn !== -1) {
      const exBtn = document.querySelector(`.option-btn[data-idx="${exclusiveBtn}"]`);
      if (exBtn) exBtn.classList.remove('selected');
      multiSelected = multiSelected.filter(i => i !== exclusiveBtn);
    }
    if (multiSelected.includes(idx)) {
      multiSelected = multiSelected.filter(i => i !== idx);
      btn.classList.remove('selected');
    } else {
      multiSelected.push(idx);
      btn.classList.add('selected');
    }
  }

  const nextBtn = document.getElementById('multiNextBtn');
  if (nextBtn) {
    nextBtn.classList.toggle('enabled', multiSelected.length > 0);
  }
}

function confirmMultiOption() {
  if (multiSelected.length === 0) return;
  advanceStep();
}

function showResult() {
  updateProgress(TOTAL_STEPS);
  const r = RESULTS[resultKey];

  mount(`
    <div class="card">
      <div class="result-photo-wrap">
        <img class="card-photo" src="${r.photo}" alt="5toolgym薬院店 トレーニング風景" loading="lazy">
        <span class="result-tag">診断結果</span>
      </div>
      <div class="card-body">
        <div class="result-type">${r.typeName}</div>
        <div class="result-title">${r.title}</div>
        <div class="result-desc">
          ${r.desc.map(p => `<p>${p}</p>`).join('')}
        </div>
        <div class="result-cta">
          <a class="btn-cta-primary" href="${r.ctaUrl}" onclick="trackCta('lp')">${r.ctaLabel}</a>
          <a class="btn-cta-secondary" href="${RESERVE_URL}" onclick="trackCta('reserve')">または直接、体験を予約する</a>
          <button class="btn-retry" onclick="retryQuiz()">もう一度診断する</button>
        </div>
      </div>
    </div>
  `);

  gtag('event', 'shindan_result', { gender: gender, result_type: resultKey });
}

function trackCta(destination) {
  gtag('event', 'shindan_cta_click', { result_type: resultKey, destination: destination });
}

function retryQuiz() {
  gtag('event', 'shindan_retry');
  gender = null;
  currentStep = 0;
  resultKey = null;
  multiSelected = [];
  renderGenderStep();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

renderGenderStep();
</script>
</body>
</html>
